name: Leilões — coleta diária

on:
  schedule:
    - cron: "40 10 * * *"   # 07h40 em Brasília (UTC-3)
  workflow_dispatch: {}      # botão "Run workflow" para rodar na hora
  push:                      # roda quando o código ou os filtros mudam
    branches: [main]
    paths: ["leiloes/**", "filtros.json", "entrada/**", ".github/workflows/leiloes.yml"]

permissions:
  contents: write            # só para gravar o banco e o mapa de volta no repositório

concurrency:
  group: leiloes
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar, alertar e geocodificar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERTA_PARA: ${{ secrets.ALERTA_PARA }}
        run: python -m leiloes.cli alerta

      - name: Atualizar mapa
        run: python -m leiloes.cli exportar

      - name: Salvar banco e mapa no repositório
        run: |
          git config user.name "leiloes-bot"
          git config user.email "leiloes-bot@users.noreply.github.com"
          git add -f data/leiloes.db docs/imoveis.json
          git diff --cached --quiet && exit 0
          git commit -m "Coleta $(date -u +%Y-%m-%d) [skip ci]"
          # O repositório pode ter mudado durante a coleta (edições suas ou minhas).
          # Incorpora essas mudanças antes de gravar; banco e mapa são só do robô, então não há conflito.
          for tentativa in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push recusado (tentativa $tentativa); tentando de novo em 10s"; sleep 10
          done
          exit 1

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: diagnostico/
          if-no-files-found: ignore
          retention-days: 7

      - name: Avisar se falhar
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] && curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Leilões: a coleta de hoje falhou. Veja em ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
