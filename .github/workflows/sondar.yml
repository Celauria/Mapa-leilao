name: Sondar fontes

# Captura amostras de fontes públicas para desenvolver os coletores.
# Salva no branch "amostras"; não mexe no main.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/sondar.yml"]

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar amostra do ITBI de São Paulo
        run: |
          set +e
          pip install -q openpyxl
          mkdir -p amostras && cd amostras
          curl -s -L --max-time 600 -o itbi2026.xlsx \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
            -H "Accept: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*" -H "Accept-Language: pt-BR" \
            -e "https://prefeitura.sp.gov.br/web/fazenda/w/acesso_a_informacao/31501" \
            "https://prefeitura.sp.gov.br/cidade/secretarias/upload/fazenda/arquivos/itbi/GUIAS%20DE%20ITBI%20PAGAS%20%2830092026%29.xlsx" \
            -w "itbi2026: HTTP %{http_code} %{content_type} %{size_download} bytes\n" | tee itbi_resumo.txt
          head -c 400 itbi2026.xlsx | file - >> itbi_resumo.txt
          head -c 1500 itbi2026.xlsx | strings | head -20 >> itbi_resumo.txt
          python - <<'PY' 2>> itbi_resumo.txt
          import openpyxl, csv, itertools
          wb = openpyxl.load_workbook("itbi2026.xlsx", read_only=True)
          with open("itbi_resumo.txt", "a") as r:
              for ws in wb.worksheets:
                  r.write(f"aba: {ws.title} dims={ws.max_row}x{ws.max_column}\n")
              ws = max(wb.worksheets, key=lambda w: w.max_row or 0)
              with open("itbi_amostra.csv", "w", newline="") as f:
                  w = csv.writer(f)
                  for row in itertools.islice(ws.iter_rows(values_only=True), 60):
                      w.writerow(row)
          PY
          rm -f itbi2026.xlsx; ls -la; cat itbi_resumo.txt; exit 0
      - name: Publicar no branch amostras
        run: |
          cd amostras
          git init -q -b amostras
          git config user.name "leiloes-bot"; git config user.email "leiloes-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Amostras $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras
