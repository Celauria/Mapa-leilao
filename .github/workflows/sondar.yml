name: Sondar fontes

# Captura amostras de fontes públicas para desenvolver os coletores.
# Salva no branch "amostras"; não mexe no main.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/sondar.yml"]

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar páginas de imóveis do Zuk
        run: |
          mkdir -p amostras && cd amostras
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for banco in banco-itau banco-bradesco banco-santander; do
            curl -s -L -A "$UA" -o lista.html "https://www.portalzuk.com.br/leilao-de-imoveis/v/$banco"; sleep 3
            n=0
            for url in $(grep -o 'https://www.portalzuk.com.br/imovel/sp/[^"]*' lista.html | sort -u | head -2); do
              n=$((n+1)); curl -s -L -A "$UA" -o "zuk_imovel_${banco}_$n.html" "$url"; echo "$url" >> urls.txt; sleep 3
            done
          done
          rm -f lista.html; ls -la
      - name: Publicar no branch amostras
        run: |
          cd amostras
          git init -q -b amostras
          git config user.name "leiloes-bot"; git config user.email "leiloes-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Amostras $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras
