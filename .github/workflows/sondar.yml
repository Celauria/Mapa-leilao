name: Sondar fontes

# Captura amostras de páginas públicas dos leiloeiros (respeitando robots.txt) para
# desenvolver os coletores. Salva no branch "amostras"; não mexe no main.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/sondar.yml"]

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar amostras
        run: |
          mkdir -p amostras && cd amostras
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          baixar() { curl -s -L -A "$UA" -H "Accept-Language: pt-BR" --max-time 40 -o "$1" "$2"; echo "$1 $(wc -c < "$1") bytes  <- $2"; sleep 3; }
          baixar zuk_santander.html https://www.portalzuk.com.br/leilao-de-imoveis/v/banco-santander
          url=$(grep -o 'https://www.portalzuk.com.br/imovel/[^"]*' zuk_santander.html | head -1)
          baixar zuk_imovel.html "$url"
          # "Carregar mais" (rota permitida pelo robots.txt): POST com o token da página e os cookies da sessão
          rm -f cj; curl -s -c cj -b cj -A "$UA" -o p1.html https://www.portalzuk.com.br/leilao-de-imoveis/v/banco-santander
          tok=$(grep -o 'name="_token" value="[^"]*"' p1.html | head -1 | cut -d'"' -f4)
          for path in /leilao-de-imoveis/v/banco-santander https://www.portalzuk.com.br/leilao-de-imoveis/v/banco-santander leilao-de-imoveis/v/banco-santander; do
            n=$(echo "$path" | md5sum | cut -c1-6)
            curl -s -c cj -b cj -A "$UA" -X POST -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://www.portalzuk.com.br/leilao-de-imoveis/v/banco-santander" \
              --data-urlencode "limit=30" --data-urlencode "count_imovel_zuk=30" --data-urlencode "path=$path" \
              --data-urlencode "order=" --data-urlencode "div_parceiro_count=0" --data-urlencode "_token=$tok" \
              -o "zuk_mais_$n.html" -w "mais path=$path -> %{http_code} %{size_download}\n" https://www.portalzuk.com.br/leilao-de-imoveis/mais
            echo "  imóveis: $(grep -o 'portalzuk.com.br/imovel/[^"]*' zuk_mais_$n.html | sort -u | wc -l)"; sleep 3
          done
          rm -f cj p1.html
          ls -la

      - name: Publicar no branch amostras
        run: |
          cd amostras
          git init -q -b amostras
          git config user.name "leiloes-bot"; git config user.email "leiloes-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Amostras $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras
