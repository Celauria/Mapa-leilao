name: Sondar fontes

# Captura amostras de páginas públicas dos leiloeiros (respeitando robots.txt) para
# desenvolver os coletores. Salva no branch "amostras"; não mexe no main.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/sondar.yml"]

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar amostras
        run: |
          mkdir -p amostras && cd amostras
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          baixar() { curl -s -L -A "$UA" -H "Accept-Language: pt-BR" --max-time 40 -o "$1" "$2"; echo "$1 $(wc -c < "$1") bytes  <- $2"; sleep 3; }
          baixar zuk_santander.html https://www.portalzuk.com.br/leilao-de-imoveis/v/banco-santander
          baixar zuk_lista.js       https://cdn.portalzuk.com.br/js/lista.aadfd05b282189b5f0794cfd76a1a463.js
          baixar zuk_agenda.html    https://www.portalzuk.com.br/agenda/leiloes
          baixar zuk_sp_capital.html https://www.portalzuk.com.br/leilao-de-imoveis/c/todos-imoveis/sp/capital/sao-paulo
          baixar zuk_sc.html        https://www.portalzuk.com.br/leilao-de-imoveis/u/todos-imoveis/sc
          # testa se a listagem aceita paginação por parâmetro (sem usar ajax-lote, bloqueado no robots.txt)
          baixar zuk_santander_p2.html "https://www.portalzuk.com.br/leilao-de-imoveis/v/banco-santander?page=2"
          baixar zuk_santander_pagina2.html "https://www.portalzuk.com.br/leilao-de-imoveis/v/banco-santander?pagina=2"
          url=$(grep -o 'https://www.portalzuk.com.br/leilao/[^"]*' zuk_agenda.html | head -1)
          [ -n "$url" ] && baixar zuk_leilao.html "$url"
          grep -o 'carregarMais.\{0,1500\}' zuk_lista.js | head -3 > zuk_carregar_mais.txt || true
          ls -la

      - name: Publicar no branch amostras
        run: |
          cd amostras
          git init -q -b amostras
          git config user.name "leiloes-bot"; git config user.email "leiloes-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Amostras $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" amostras
