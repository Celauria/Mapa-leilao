<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leilões">
<meta name="theme-color" content="#172033">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Mapa de Leilões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <div class="marca">
    <h1>Mapa de Leilões</h1>
    <span id="atualizado" class="sutil"></span>
  </div>
  <div class="busca-topo" id="lugarBusca">
    <input id="busca" type="search" placeholder="Buscar rua, bairro ou cidade" aria-label="Buscar rua, bairro ou cidade" autocomplete="off">
  </div>
  <div class="acoes">
    <span id="contagem" class="sutil" aria-live="polite">carregando…</span>
    <div class="vista" role="group" aria-label="Forma de ver">
      <button type="button" data-vista="mapa" aria-pressed="true">Mapa</button>
      <button type="button" data-vista="tabela" aria-pressed="false">Tabela</button>
    </div>
    <select id="ordem" aria-label="Ordenar">
      <option value="score">Melhor score</option>
      <option value="desconto">Maior desconto</option>
      <option value="mercado">Mais abaixo do mercado</option>
      <option value="preco">Menor preço</option>
      <option value="leilao">Leilão mais próximo</option>
      <option value="recentes">Mais recentes</option>
    </select>
    <button id="exportar" type="button" class="secundario">Exportar CSV</button>
    <button id="abrirFiltros" type="button" class="secundario so-celular" aria-haspopup="dialog">Filtros<span id="nFiltros" class="badge" hidden></span></button>
  </div>
  <div id="chips" class="chips" aria-label="Filtros ativos"></div>
</header>

<div class="corpo">
  <aside id="painel" class="painel" hidden role="dialog" aria-labelledby="tPainel">
    <div class="painel-fundo" id="fundoPainel"></div>
    <div class="painel-caixa">
      <div class="painel-topo">
        <h2 id="tPainel">Filtros</h2>
        <button id="limpar" type="button" class="link">Limpar tudo</button>
      </div>
      <div class="painel-corpo">
        <fieldset>
          <legend>Onde</legend>
          <label>Banco<select id="banco"><option value="">Todos</option></select></label>
          <label>Estado<select id="filtro"><option value="">SP e SC</option></select></label>
          <label>Cidade<select id="cidade"><option value="">Todas</option></select></label>
          <label>Bairro<select id="bairro" disabled><option value="">Escolha a cidade</option></select></label>
        </fieldset>
        <fieldset>
          <legend>Imóvel</legend>
          <label>Tipo<select id="tipo"><option value="">Todos</option></select></label>
          <div class="par">
            <label>Quartos<select id="quartos">
              <option value="">Todos</option><option value="1">1 ou mais</option><option value="2">2 ou mais</option><option value="3">3 ou mais</option>
            </select></label>
            <label>Vagas<select id="vagas">
              <option value="">Todas</option><option value="0">Sem vaga</option><option value="1">1 ou mais</option><option value="2">2 ou mais</option>
            </select></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Preço e condições</legend>
          <label>Modalidade<select id="modalidade"><option value="">Todas</option></select></label>
          <div class="par">
            <label>Desconto<select id="desconto_min">
              <option value="">Qualquer</option><option value="0.5">Com desconto</option><option value="20">20% ou mais</option>
              <option value="30">30% ou mais</option><option value="40">40% ou mais</option><option value="50">50% ou mais</option>
            </select></label>
            <label>Preço até (R$)<input id="preco_max" type="number" inputmode="numeric" step="10000" placeholder="350000"></label>
          </div>
          <label>Financiamento<select id="financiamento">
            <option value="">Tanto faz</option><option value="Sim">Aceita financiamento</option><option value="Não">Só à vista</option>
          </select></label>
          <label>Entrou no mapa<select id="periodo">
            <option value="">Qualquer data</option><option value="1">Últimas 24 horas</option><option value="7">Últimos 7 dias</option>
          </select></label>
        </fieldset>
        <details id="premissas">
          <summary>Premissas de custo e financiamento</summary>
          <div class="par">
            <label>ITBI (%)<input id="p_itbi" type="number" inputmode="decimal" step="0.1"></label>
            <label>Cartório (%)<input id="p_cartorio" type="number" inputmode="decimal" step="0.1"></label>
            <label>Comissão (%)<input id="p_comissao" type="number" inputmode="decimal" step="0.5"></label>
            <label>Entrada (%)<input id="p_entrada" type="number" inputmode="decimal" step="5"></label>
            <label>Juros (% a.a.)<input id="p_juros" type="number" inputmode="decimal" step="0.1"></label>
            <label>Prazo (meses)<input id="p_prazo" type="number" inputmode="numeric" step="12"></label>
          </div>
          <p class="nota">Estimativas. ITBI e cartório variam por cidade; a comissão vale só para leilões. Ficam salvas só neste navegador.</p>
        </details>
      </div>
      <button id="verResultados" type="button" class="primario so-celular">Ver imóveis</button>
    </div>
  </aside>

  <main id="vistaMapa" class="vista-mapa">
    <div id="mapa" aria-label="Mapa dos imóveis"></div>
    <section id="lateral" class="lateral" aria-label="Resultados">
      <div id="lista" class="lista"></div>
      <article id="detalhe" class="detalhe" hidden tabindex="-1"></article>
    </section>
  </main>

  <section id="vistaTabela" class="vista-tabela" hidden aria-label="Tabela de imóveis">
    <table id="tabela">
      <thead><tr></tr></thead>
      <tbody></tbody>
    </table>
    <p id="tabelaNota" class="nota"></p>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
