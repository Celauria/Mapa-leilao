<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leilões">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<title>Mapa de Leilões</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e3e1db; --accent:#0f6b5c; --warn:#b5462a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#1f1f1d; --ink:#ecebe7; --muted:#a3a19b; --line:#33322f; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  select:disabled { opacity:.55; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:calc(env(safe-area-inset-top) + 10px) 12px 10px; border-bottom:1px solid var(--line); background:var(--card); }
  .topo { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  h1 { font-size:17px; margin:0; }
  #contagem { color:var(--muted); font-size:13px; }
  body { display:flex; flex-direction:column; }
  .filtros { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:6px; margin-top:8px; }
  select, input { width:100%; min-width:0; padding:7px 9px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font:inherit; font-size:16px; text-overflow:ellipsis; }
  main { flex:1; min-height:0; display:grid; grid-template-columns: 1fr 420px; }
  #mapa { height:100%; }
  #lista { overflow:auto; border-left:1px solid var(--line); -webkit-overflow-scrolling:touch; padding-bottom:env(safe-area-inset-bottom); }
  .item { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; background:var(--card); }
  .item.ativo { outline:2px solid var(--accent); outline-offset:-2px; }
  .linha { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .preco { font-weight:600; }
  .desc { color:var(--accent); font-weight:600; }
  #mais { margin-top:6px; padding:2px 0; border:0; background:none; color:var(--accent); font:inherit; font-size:14px; }
  .desc.nulo { color:var(--muted); font-weight:400; font-size:13px; }
  .ficha { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:14px; }
  .ficha a { display:inline-block; margin-top:6px; color:var(--accent); }
  .dica { font-size:13px; color:var(--muted); border-left:3px solid var(--accent); padding-left:8px; margin:6px 0; }
  .carac { color:var(--ink); font-size:13px; margin-top:2px; }
  .meta, .motivos { color:var(--muted); font-size:13px; }
  .score { min-width:36px; text-align:center; border-radius:999px; padding:1px 8px; font-weight:600; color:#fff; font-size:13px; }
  .novo { font-size:11px; font-weight:600; color:#fff; background:var(--accent); border-radius:4px; padding:1px 5px; margin-left:6px; }
  .alerta { color:var(--warn); font-size:13px; }
  .leaflet-popup-content { font-size:14px; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background:var(--card); color:var(--ink); }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
  .leaflet-popup-content a { color:var(--accent); }
  @media (max-width: 800px) { .filtros { grid-template-columns:1fr 1fr; } main { grid-template-columns:1fr; grid-template-rows: 45% 55%; } #lista { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <div class="topo"><h1>Mapa de Leilões</h1><span id="contagem">carregando…</span></div>
  <div class="filtros">
    <select id="filtro" aria-label="Estado"><option value="">SP e SC</option></select>
    <select id="cidade" aria-label="Cidade"><option value="">Cidade: todas</option></select>
    <select id="bairro" aria-label="Bairro" disabled><option value="">Bairro: escolha a cidade</option></select>
    <select id="tipo" aria-label="Tipo"><option value="">Tipo: todos</option></select>
    <select id="modalidade" aria-label="Modalidade"><option value="">Modalidade: todas</option></select>
    <select id="desconto_min" aria-label="Desconto mínimo">
      <option value="">Todo desconto</option>
      <option value="0.5">Com desconto</option>
      <option value="20">≥ 20% desc.</option>
      <option value="30">≥ 30% desc.</option>
      <option value="40">≥ 40% desc.</option>
      <option value="50">≥ 50% desc.</option>
    </select>
    <select id="financiamento" aria-label="Financiamento">
      <option value="">Financiamento: todos</option>
      <option value="Sim">Aceita financiamento</option>
      <option value="Não">Só à vista</option>
    </select>
    <select id="ordem" aria-label="Ordenar">
      <option value="score">Melhor score</option>
      <option value="desconto">Maior desconto</option>
      <option value="preco">Menor preço</option>
      <option value="recentes">Mais recentes</option>
    </select>
  </div>
  <button id="mais" type="button" aria-expanded="false">Mais filtros</button>
  <div class="filtros" id="extras" hidden>
    <select id="quartos" aria-label="Quartos">
      <option value="">Quartos: todos</option>
      <option value="1">1+ quarto</option><option value="2">2+ quartos</option><option value="3">3+ quartos</option>
    </select>
    <select id="vagas" aria-label="Vagas">
      <option value="">Vagas: todas</option>
      <option value="0">Sem vaga</option><option value="1">1+ vaga</option><option value="2">2+ vagas</option>
    </select>
    <input id="preco_max" type="number" inputmode="numeric" placeholder="Preço máx. (R$)" aria-label="Preço máximo">
    <select id="periodo" aria-label="Período"><option value="">Qualquer data</option><option value="1">Novos (24h)</option><option value="7">Últimos 7 dias</option></select>
    <input id="busca" placeholder="Bairro, rua, tipo…" aria-label="Busca">
  </div>
</header>
<main>
  <div id="mapa"></div>
  <div id="lista"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
